<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Scanner un QR Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .scan-wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--sp-bg);
      color: var(--sp-text);
    }
    .scan-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 20px 12px 0;
    }
    h1 { margin: 8px 0 4px; }
    #reader {
      width: 100%;
      max-width: 420px;
      margin: 10px auto 0;
      padding: 10px;
      border: 2px dashed var(--sp-reader-border);
      border-radius: 10px;
      background: var(--sp-surface);
    }
    .button-bar {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    footer {
      background:var(--sp-primary);
      color:#fff;
      text-align:center;
      padding:10px 12px;
    }
    .scan-message { min-height: 1.4em; font-weight: 600; padding: 6px 12px; border-radius: 8px; text-align: center; max-width: 420px; }
    .scan-flash-ok { animation: scanFlashOk 0.9s ease-out; }
    .scan-flash-err { animation: scanFlashErr 0.9s ease-out; }
    @keyframes scanFlashOk { 0% { background: rgba(19,140,39,0.30); } 100% { background: transparent; } }
    @keyframes scanFlashErr { 0% { background: rgba(176,0,32,0.25); } 100% { background: transparent; } }
  </style>
  <script src="scanprof-core.js"></script>
  <script src="theme.js" defer></script>
  <script src="lib/html5-qrcode.min.js" defer></script>
  <script src="app-store.js" defer></script>
  <script src="scanner.js" defer></script>
</head>
<body>
  <div class="scan-wrap">
    <main class="scan-main">
      <h1>📷 Scanner un QR Code</h1>
      <div id="reader"></div>
      <p id="scan-result" class="scan-message"></p>
      <div class="button-bar">
        <a href="index.html" class="button green">🏠 Accueil</a>
        <a href="participants.html" class="button blue">👥 Voir les participants</a>
      </div>
    </main>

    <footer>
      ScanProf - Équipe EPS Lycée Vauban - LUXEMBOURG - JB
    </footer>
  </div>
</body>
</html>
